---
- name: Deploy Zabbix Agent 7.0 LTS
  hosts: all
  become: true

  vars:
    zabbix_repo_package: "zabbix-release_latest_7.0+ubuntu22.04_all.deb"
    zabbix_repo_url: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/{{ zabbix_repo_package }}"
    zabbix_server_ip: "zabbix_server_ip"

  tasks:
    - name: Installing required dependencies
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
        state: present
        update_cache: true

    - name: Downloading Zabbix repository package
      ansible.builtin.get_url:
        url: "{{ zabbix_repo_url }}"
        dest: "/tmp/{{ zabbix_repo_package }}"
        mode: '0644'

    - name: Installing Zabbix repository package
      ansible.builtin.apt:
        deb: "/tmp/{{ zabbix_repo_package }}"

    - name: Installing Zabbix Agent 2 and plugins
      ansible.builtin.apt:
        name:
          - zabbix-agent2
          - zabbix-agent2-plugin-mongodb
          - zabbix-agent2-plugin-mssql
          - zabbix-agent2-plugin-postgresql
        state: present
        update_cache: true

    - name: Deploying Zabbix Agent configuration from template
      ansible.builtin.template:
        src: zabbix_agent2.conf.j2
        dest: /etc/zabbix/zabbix_agent2.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Agent

  handlers:
    - name: Restart Agent
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted
